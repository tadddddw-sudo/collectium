<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Collectium is a showcase for binders and display cases — share a collector's shelf with a link or a QR code."
    />
    <meta name="theme-color" content="#0f141e" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <title>Collectium</title>
    <script>
      // Apply the saved light/dark theme before first paint (see src/lib/theme.js).
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('collectium-theme'); } catch (e) {}
        var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
