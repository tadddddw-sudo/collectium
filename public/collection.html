<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collectium — Showcase</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #18181b; color: #f4f4f5; }
    .container { max-width: 1040px; margin: 0 auto; padding: 1.5rem 1rem; }
    .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
    .topbar a { color: #3ecf8e; text-decoration: none; font-weight: 600; }
    .btn { padding: 0.55rem 0.95rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; background: #3ecf8e; color: #09090b; font-size: 0.9rem; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary { background: #27272a; color: #f4f4f5; border: 1px solid #3f3f46; }
    .btn-danger { background: #dc2626; color: white; }

    /* Binder Styles */
    .binder-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; background: #27272a; padding: 0.8rem 1rem; border-radius: 10px; margin-bottom: 1rem; }
    .customizer { display: none; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-size: 0.85rem; }
    .customizer input[type="number"] { width: 52px; padding: 0.3rem; border-radius: 4px; border: 1px solid #52525b; background: #18181b; color: white; }
    .binder-grid { display: grid; gap: 1rem; background: #27272a; padding: 1.5rem; border-radius: 14px; min-height: 460px; }
    .binder-slot { aspect-ratio: 3 / 4; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0.75rem; cursor: pointer; position: relative; transition: transform 0.15s; }
    .grid-visible .binder-slot { border: 2px dashed #52525b; background: rgba(255,255,255,0.03); }
    .grid-hidden .binder-slot { border: none; background: transparent; }
    .binder-slot:hover { transform: scale(1.02); }
    .binder-slot img { max-width: 100%; max-height: 85%; object-fit: contain; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.45)); }
    .slot-label { font-size: 0.8rem; color: #a1a1aa; margin-top: 0.4rem; text-align: center; }
    .empty-slot { color: #71717a; font-size: 0.85rem; }
    .slot-highlighted { box-shadow: 0 0 0 3px #3ecf8e, 0 0 24px rgba(62, 207, 142, 0.5); }

    /* Display Case Styles */
    .case-stage { position: relative; width: 100%; height: 540px; border-radius: 14px; background: linear-gradient(180deg, #27272a 0%, #1f1f23 48%, #3f3f46 50%, #27272a 52%, #18181b 98%, #3f3f46 100%); border: 2px solid #3f3f46; overflow: hidden; }
    .case-item { position: absolute; transform: translate(-50%, -50%); cursor: grab; user-select: none; max-width: 160px; max-height: 160px; padding: 6px; border-radius: 8px; touch-action: none; }
    .case-item img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(0,0,0,0.65)); pointer-events: none; }

    /* Modals & Cutout Toggle */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; padding: 1rem; z-index: 50; overflow-y: auto; }
    .modal-box { background: #27272a; color: #f4f4f5; padding: 1.5rem; border-radius: 12px; width: 100%; max-width: 460px; }

    .mode-toggle { display: grid; grid-template-columns: repeat(4, 1fr); background: #18181b; padding: 4px; border-radius: 8px; border: 1px solid #3f3f46; margin-bottom: 1rem; }
    #square-canvas { border: 2px solid #3ecf8e; border-radius: 8px; cursor: grab; display: block; margin: 0.5rem auto; width: 260px; height: 260px; touch-action: none; }
    #square-canvas:active { cursor: grabbing; }
    .zoom-row { display: flex; align-items: center; gap: 0.6rem; justify-content: center; margin-top: 0.5rem; font-size: 0.85rem; }
    .zoom-row input[type="range"] { flex: 1; max-width: 200px; accent-color: #3ecf8e; }

    .mode-btn { padding: 0.5rem 0.3rem; border: none; border-radius: 6px; background: transparent; color: #a1a1aa; font-weight: 600; font-size: 0.75rem; cursor: pointer; transition: all 0.15s; }
    .mode-btn.active { background: #3ecf8e; color: #09090b; }
    .editor-toolbar { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.5rem; }
    .form-group { margin-bottom: 0.9rem; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #d4d4d8; }
    .form-group input { width: 100%; padding: 0.55rem; border: 1px solid #52525b; border-radius: 6px; background: #18181b; color: white; }
    #outline-canvas { border: 2px dashed #3ecf8e; border-radius: 8px; cursor: crosshair; max-width: 100%; display: block; margin: 0.5rem auto; background: repeating-conic-gradient(#3f3f46 0% 25%, #27272a 0% 50%) 50% / 16px 16px; touch-action: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <a id="back-link" href="profile.html">← Back to Profile</a>
        <h1 id="col-title" style="margin:0.4rem 0 0.2rem;">Loading...</h1>
        <div id="col-subtitle" style="color:#a1a1aa;font-size:0.9rem;"></div>
      </div>
      <button id="case-add-btn" class="btn" style="display:none;">+ Add Memorabilia Item</button>
    </div>

    <!-- Binder View -->
    <div id="binder-view" style="display:none;">
      <div class="binder-toolbar">
        <div style="display:flex;align-items:center;gap:0.6rem;">
          <button id="prev-page" class="btn btn-secondary">◀ Prev</button>
          <span id="page-indicator" style="font-weight:600;">Page 1 of 1</span>
          <button id="next-page" class="btn btn-secondary">Next ▶</button>
        </div>
        <div id="binder-customizer" class="customizer">
          Pages: <input type="number" id="edit-pages" min="1" max="50" />
          Rows: <input type="number" id="edit-rows" min="1" max="8" />
          Cols: <input type="number" id="edit-cols" min="1" max="8" />
          <label><input type="checkbox" id="edit-grid" /> Grid</label>
          <button id="save-layout-btn" class="btn">Apply</button>
        </div>
      </div>
      <div id="binder-grid" class="binder-grid"></div>
    </div>

    <!-- Display Case View -->
    <div id="case-view" style="display:none;">
      <p style="font-size:0.85rem;color:#a1a1aa;margin-top:0;">Click any item to view details & generate its QR code. Owners can drag items to arrange shelves.</p>
      <div id="case-stage" class="case-stage"></div>
    </div>
  </div>

  <!-- Upload + Smart Image Processing Modal -->
  <div id="upload-modal" class="modal" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-box">
      <h3 style="margin-top:0;">Add Collectible</h3>

      <div class="mode-toggle">
        <button type="button" id="mode-auto-btn" class="mode-btn active">✨ Auto AI</button>
        <button type="button" id="mode-manual-btn" class="mode-btn">✂️ Snip</button>
        <button type="button" id="mode-perspective-btn" class="mode-btn">📐 Perspective</button>
        <button type="button" id="mode-square-btn" class="mode-btn">🔲 Square</button>
      </div>

      <form id="upload-form">
        <div class="form-group">
          <label>Select Photo</label>
          <input type="file" id="item-file" accept="image/*" required />
          <div id="bg-status" style="font-size:0.8rem;color:#3ecf8e;margin-top:0.4rem;"></div>
        </div>

        <!-- 1. Automatic AI Cutout Preview -->
        <div id="ai-preview-wrap" style="display:none;text-align:center;margin-bottom:1rem;">
          <img id="ai-preview-img" style="max-height:200px;background:repeating-conic-gradient(#3f3f46 0% 25%, #27272a 0% 50%) 50% / 16px 16px;border-radius:8px;padding:8px;" />
        </div>

        <!-- 2. Point snip + Perspective editor (shared canvas, mode-switched) -->
        <div id="manual-editor-wrap" style="display:none;text-align:center;margin-bottom:1rem;">
          <p id="snip-hint" style="font-size:0.8rem;color:#a1a1aa;margin:0;"></p>
          <canvas id="outline-canvas"></canvas>
          <div class="editor-toolbar">
            <button type="button" id="undo-point-btn" class="btn btn-secondary" style="font-size:0.8rem;" disabled>↩ Undo Point</button>
            <button type="button" id="finish-snip-btn" class="btn" style="font-size:0.8rem;" disabled>✂️ Finish Snip</button>
            <button type="button" id="reset-outline-btn" class="btn btn-secondary" style="font-size:0.8rem;">Reset</button>
          </div>

          <!-- Perspective-only controls -->
          <div id="perspective-controls" style="display:none;margin-top:0.7rem;">
            <div style="display:flex;align-items:center;gap:0.6rem;justify-content:center;flex-wrap:wrap;font-size:0.8rem;">
              <label style="color:#a1a1aa;">
                Aspect:
                <select id="perspective-aspect" style="padding:0.3rem;border-radius:4px;border:1px solid #52525b;background:#18181b;color:white;font-size:0.8rem;">
                  <option value="auto">Auto (from quad)</option>
                  <option value="2.5:3.5">Card · 2.5:3.5</option>
                  <option value="1:1">Square · 1:1</option>
                  <option value="4:3">Photo · 4:3</option>
                  <option value="3:2">Photo · 3:2</option>
                  <option value="16:9">Wide · 16:9</option>
                </select>
              </label>
            </div>
            <div id="perspective-preview-wrap" style="display:none;margin-top:0.7rem;">
              <p style="font-size:0.8rem;color:#a1a1aa;margin:0 0 0.3rem;">Warp preview:</p>
              <img id="perspective-preview" style="max-width:240px;max-height:240px;background:repeating-conic-gradient(#3f3f46 0% 25%, #27272a 0% 50%) 50% / 16px 16px;border-radius:8px;padding:6px;" />
            </div>
          </div>
        </div>

        <!-- 3. Square Cutout & Scale Editor -->
        <div id="square-editor-wrap" style="display:none;text-align:center;margin-bottom:1rem;">
          <p style="font-size:0.8rem;color:#a1a1aa;margin:0;">Drag to center your item and use the slider to scale it up to fit the slot.</p>
          <canvas id="square-canvas"></canvas>
          <div class="zoom-row">
            <span>Scale:</span>
            <input type="range" id="square-zoom-slider" min="1" max="4" step="0.05" value="1" />
            <span id="square-zoom-label" style="min-width:38px;font-weight:600;color:#3ecf8e;">1.0x</span>
            <button type="button" id="reset-square-btn" class="btn btn-secondary" style="font-size:0.75rem;padding:0.35rem 0.6rem;">Reset</button>
          </div>
        </div>

        <div class="form-group">
          <label>Item Name</label>
          <input id="item-name" required placeholder="e.g. 1st Edition Charizard" />
        </div>
        <div class="form-group">
          <label>Notes / Condition</label>
          <input id="item-desc" placeholder="e.g. Mint condition, 1999" />
        </div>
        <button type="submit" id="save-item-btn" class="btn" style="width:100%;">Save to Collection</button>
      </form>
    </div>
  </div>

  <!-- Direct Item Link & QR Share Modal -->
  <div id="item-modal" class="modal" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-box" style="text-align:center;">
      <img id="share-item-img" style="max-height:180px;filter:drop-shadow(0 6px 12px rgba(0,0,0,0.5));" />
      <h3 id="share-item-name" style="margin:0.6rem 0 0.2rem;"></h3>
      <p id="share-item-desc" style="color:#a1a1aa;font-size:0.85rem;margin-top:0;"></p>
      <img id="share-item-qr" style="width:180px;height:180px;border-radius:8px;margin:0.5rem 0;" />
      <input id="share-item-url" readonly style="width:100%;padding:0.45rem;margin-bottom:0.7rem;border-radius:6px;border:1px solid #52525b;background:#18181b;color:#d4d4d8;font-size:0.75rem;" />
      <div style="display:flex;gap:0.5rem;justify-content:center;">
        <button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('share-item-url').value)">Copy Direct Slot Link</button>
        <button id="delete-item-btn" class="btn btn-danger" style="display:none;">Delete</button>
      </div>
    </div>
  </div>

  <!-- QR generator (UMD, exposes window.qrcode) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

  <script type="module" src="./js/views/collectionView.js"></script>
</body>
</html>
